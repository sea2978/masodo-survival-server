name: Engine Smoke Test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Core engine
        run: npm run test:engine
      - name: Catalog and version
        run: npm run test:catalog
      - name: Recommendations
        run: npm run test:recommendations
      - name: Event conditions
        run: npm run test:event-conditions
      - name: 15 minute simulation
        run: npm run test:simulation
