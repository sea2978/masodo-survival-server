name: Engine Smoke Test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Regular client and preserved mobile layout
        run: npm run test:formal-client && npm run test:lobby-login && npm run test:item-codex && npm run test:enemy-contacts && npm run test:enemy-traces && npm run test:event-wait && npm run test:clock-contacts && npm run test:death-hud && npm run test:portrait-reactions && npm run test:client-startup
      - name: API-only server and standalone client separation
        run: node tests/api_only_server_smoke.mjs
      - name: Active skill bonus tuning
        run: node tests/skill_bonus_audit.mjs
      - name: Passive minimum tuning
        run: node tests/passive_minimum_audit.mjs
      - name: Carbonara instant death
        run: node tests/carbonara_death_audit.mjs
      - name: Room name and AI settings
        run: node tests/room_settings_smoke.mjs
      - name: Inventory management and overflow rewards
        run: node tests/repeatable_equipment_smoke.mjs && node tests/region_restrictions_smoke.mjs && node tests/region_restrictions_ui.mjs && node tests/info_refresh_smoke.mjs && node tests/craft_equipment_smoke.mjs && node tests/craft_equipment_ui.mjs && node tests/inventory_management_smoke.mjs && node tests/inventory_ui_smoke.mjs
      - name: Consumable crafting
        run: node tests/consumable_crafting_smoke.mjs
      - name: State deltas, full-room traffic and recovery
        run: node tests/state_transport_smoke.mjs
      - name: Reconnection flow
        run: node tests/reconnect_smoke.mjs
      - name: Combat notifications
        run: node tests/combat_notice_smoke.mjs
      - name: Match results
        run: node tests/match_result_smoke.mjs
      - name: Core engine
        run: npm run test:engine
      - name: Catalog and version
        run: npm run test:catalog
      - name: Full content parity audit
        run: npm run test:full-audit
      - name: Runtime parity audit
        run: npm run test:phase2p-runtime
      - name: All 51 combat skills
        run: npm run test:all-combat
      - name: All 51 additional actions
        run: npm run test:all-actions
      - name: All consumables
        run: npm run test:all-consumables
      - name: All 234 event choices
        run: npm run test:all-events
      - name: Client server static audit
        run: npm run test:static-audit
      - name: Craft preflight audit
        run: npm run test:craft-preflight
      - name: Recommendations
        run: npm run test:recommendations
      - name: Event E004 tool condition
        run: npm run test:event-e004
      - name: Event E008 precision condition
        run: npm run test:event-e008
      - name: Information-event persistence
        run: npm run test:intel
      - name: Concurrent loot race
        run: npm run test:concurrency
      - name: Simultaneous combat race
        run: npm run test:combat-concurrency
      - name: Passive and gear modifier audit
        run: npm run test:passive-audit
      - name: Phase 2O parity and event noise
        run: npm run test:phase2o
      - name: Audit phase complete marker
        run: echo "Parity/content audit suites completed; stress suites intentionally deferred to next phase."
