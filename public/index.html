<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>마소도 Cloudflare 멀티플레이 Phase 2A</title>
<style>
body{font-family:system-ui,sans-serif;background:#101318;color:#eee;max-width:1000px;margin:0 auto;padding:24px}
.panel{background:#181d24;border:1px solid #333b46;border-radius:10px;padding:16px;margin:12px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;align-items:center}
input,button,select{background:#0f1318;color:#eee;border:1px solid #46515f;border-radius:6px;padding:9px;min-height:40px}
button{cursor:pointer}.good{color:#9bd69b}.bad{color:#ef9a9a}.muted{color:#a8b0bb}.host{color:#ffd66b}
#log{height:220px;overflow:auto;background:#0b0e12;padding:10px;white-space:pre-wrap}
code{color:#acd0ff}a{color:#acd0ff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#moveButtons button{min-width:150px}
@media(max-width:720px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<h1>마소도 Cloudflare 멀티플레이 Phase 2A</h1>
<p class="muted">방/Ready뿐 아니라 경기 시작 상태와 지역 이동 판정을 Cloudflare Durable Object 서버가 직접 관리합니다.</p>

<div class="panel">
  <h2>1. 로비</h2>
  <div class="row">
    <button id="create">방 생성</button>
    <input id="room" placeholder="방 코드" maxlength="6">
    <input id="name" placeholder="플레이어 이름" value="Player">
    <select id="char"><option value="c01">c01 · 서노리</option></select>
    <select id="startRegion"><option value="city">텅 빈 도심</option></select>
    <button id="join">접속</button>
  </div>
  <div class="row">
    <button id="ready">Ready ON</button>
    <button id="unready">Ready OFF</button>
    <button id="start">방장: 경기 시작</button>
    <a href="/offline.html">0.6.4 오프라인 빌드</a>
  </div>
  <p>연결: <b id="status">미접속</b></p>
  <div id="roomState"></div>
</div>

<div class="grid">
  <div class="panel">
    <h2>2. 서버 경기 상태</h2>
    <div id="matchEmpty" class="muted">경기가 시작되면 서버 상태가 표시됩니다.</div>
    <div id="matchState" hidden>
      <p><b id="selfName">-</b> · <span id="selfChar">-</span></p>
      <p>현재 지역: <b id="selfRegion">-</b></p>
      <p>HP <b id="selfHp">-</b> / SP <b id="selfSp">-</b> / 포만도 <b id="selfSat">-</b></p>
      <p>생존 <b id="aliveCount">-</b>명</p>
      <p id="pendingAction" class="muted">행동 없음</p>
      <div id="moveButtons" class="row"></div>
      <button id="refresh">상태 새로고침</button>
    </div>
  </div>

  <div class="panel">
    <h2>서버 로그</h2>
    <div id="log"></div>
  </div>
</div>

<script type="module">
import { MasodoNetworkAdapter } from "./network_adapter.js";
const net=new MasodoNetworkAdapter(location.origin), $=s=>document.querySelector(s);
let lastRoom=null,lastMatch=null;

const log=x=>{$('#log').textContent+=x+"\n";$('#log').scrollTop=999999};
const regionName=id=>{
  const list=net.catalog?.regions||lastMatch?.regions||[];
  return list.find(r=>r.id===id)?.name||id;
};

function fillCatalog(){
  const chars=net.catalog?.characters||[];
  const regions=net.catalog?.regions||[];
  if(chars.length)$('#char').innerHTML=chars.map(c=>`<option value="${c.id}">${c.id} · ${c.name}</option>`).join("");
  if(regions.length)$('#startRegion').innerHTML=regions.map(r=>`<option value="${r.id}">${r.name}</option>`).join("");
}

function renderRoom(r){
  lastRoom=r;
  $('#roomState').innerHTML=`<p><code>${r.code}</code> · ${r.humanCount}/${r.maxHumans} · ${r.phase}</p>`+
    r.players.map(p=>`<div>${p.ready?"✅":"⬜"} ${p.host?'<span class="host">[방장]</span> ':''}${p.playerName} / ${p.charId} / 시작: ${regionName(p.startRegion)}</div>`).join("");
}

function renderMatch(m){
  lastMatch=m;
  $('#matchEmpty').hidden=true;$('#matchState').hidden=false;
  const p=m.self;
  if(!p){$('#matchState').innerHTML='<p class="bad">이 연결에 대응하는 서버 플레이어가 없습니다.</p>';return}
  $('#selfName').textContent=p.playerName;$('#selfChar').textContent=p.charId;
  $('#selfRegion').textContent=regionName(p.region);
  $('#selfHp').textContent=Math.round(p.hp)+'/'+p.maxHp;
  $('#selfSp').textContent=Math.round(p.sp)+'/'+p.maxSp;
  $('#selfSat').textContent=Math.round(p.satiety);
  $('#aliveCount').textContent=m.aliveCount;

  const pa=p.pendingAction;
  $('#pendingAction').textContent=pa?`${pa.label}: ${regionName(pa.from)} → ${regionName(pa.to)} (서버 완료시각 ${new Date(pa.completeAt).toLocaleTimeString()})`:'행동 없음';

  const next=(m.adjacency?.[p.region]||[]);
  $('#moveButtons').innerHTML=next.map(id=>`<button data-move="${id}" ${pa?'disabled':''}>${regionName(id)}로 이동</button>`).join("");
  $('#moveButtons').querySelectorAll('[data-move]').forEach(btn=>btn.addEventListener('click',()=>net.move(btn.dataset.move)));
}

net.on("*",m=>log(JSON.stringify(m)));
net.on("connected",m=>{
  $('#status').textContent="WebSocket 연결됨";$('#status').className="good";
  if(m.catalog){net.catalog=m.catalog;fillCatalog()}
});
net.on("room_state",m=>renderRoom(m.room));
net.on("match_started",m=>{log("경기 시작: "+m.matchId);net.requestState()});
net.on("match_state",m=>renderMatch(m.match));
net.on("action_accepted",m=>log("서버 행동 접수: "+JSON.stringify(m.action)));
net.on("error",m=>log("SERVER ERROR: "+m.error));
net.on("close",()=>{$('#status').textContent="연결 종료";$('#status').className="bad"});

$('#create').onclick=async()=>{try{const r=await net.createRoom();$('#room').value=r.code;log("방 생성: "+r.code)}catch(e){log("생성 실패: "+e.message)}};
$('#join').onclick=async()=>{try{
  await net.connect($('#room').value,{playerName:$('#name').value,charId:$('#char').value,startRegion:$('#startRegion').value});
  $('#status').textContent="접속 중...";
}catch(e){log("접속 실패: "+e.message)}};
$('#char').addEventListener('change',()=>{if(net.ws?.readyState===WebSocket.OPEN)net.setCharacter($('#char').value)});
$('#startRegion').addEventListener('change',()=>{if(net.ws?.readyState===WebSocket.OPEN)net.setStartRegion($('#startRegion').value)});
$('#ready').onclick=()=>net.setReady(true);
$('#unready').onclick=()=>net.setReady(false);
$('#start').onclick=()=>net.requestStart();
$('#refresh').onclick=()=>net.requestState();
</script>
</body>
</html>
